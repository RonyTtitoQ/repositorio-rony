<html>
<head>
<title>Herramientas de desarrollo Frontend</title>
<style>
    
*{
    padding:0px;
    margin:0px;
}
.contenedor{
    width: 1000px;
    height:300px;
    border:1px solid rgb(2, 2, 2);
    margin:0 auto;
    position: relative;
    overflow: hidden;
}
.tarjeta1, .tarjeta2, .tarjeta3, .tarjeta4,.tarjeta5{
    width:200px;
    height:300px;
    position: absolute;
    top:-300px;
    background-size: cover;
}
.tarjeta1{
    background-image: url(img/CSS.jpg);
    left:0px;
    animation:  tarjeta1 3s 1 forwards;
}
.tarjeta2{
    background-image: url(img/HTML.jpg);
    left:200px;
    animation:tarjeta2 3s 1 forwards 3s;
}
.tarjeta3{
    background-image: url(img/JAVA\ SCRIPT.jpg);
    left:400px;
    animation: tarjeta3 3s 1 forwards 6s;
}
.tarjeta4{
    background-image: url(img/PHP.jpg);
    left:600px;
    animation: tarjeta4 3s 1 forwards 8s;
}
.tarjeta5{
    background-image: url(img/REACT.jpg);
    left:800px;
    animation: tarjeta5 3s 1 forwards 12s;
}

.contenedor .cuadrito{
    color: rgb(243, 235, 235);
    font-weight: bold;
    font-size: 30px;
    position: absolute;   
    background-size: cover;
    top: 400px;
    left: 300px;
    z-index: 10;

    animation:cuadrito 3s 1 forwards 15s;
}
@keyframes cuadrito{
    0%{
        top:400px;
        left: 300px;
    }
    50%{
        top:-100px;
        left: 200px;
        transform: rotateY(180deg);
    }
    100%{
        top:260px;
        left: 300px;
    }
}


/*LAS RICAS ANIMACIONES*/
@keyframes tarjeta1{
    0%{
        top:-300px;
        transform: rotateY(180deg);
    }
    50%{
        top:300px;
    }
    100%{
        top:0px;
    }
}
@keyframes tarjeta2{
    0%{
        top:-300px;
        left: 800px;
        transform: rotateY(0deg);
    }
    50%{
        top:300px;
        transform: rotateY(90deg);
    }
    100%{
        top:0px;
        transform: rotateY(360deg);
    }
}
@keyframes tarjeta3{
    0%{
        top:-300px;
        left: 200PX;
        transform: rotateY(0deg);
    }
    50%{
        top:300px;
        transform: rotateY(90deg);
    }
    100%{
        top:0px;
        transform: rotateY(360deg);
    }
}
@keyframes tarjeta4{
    0%{
        top:300px;
        left: -500px;
        transform: rotateY(0deg);
    }
    50%{
        top:300px;
        left: -500px;
        transform: rotateY(180deg);
    }
    100%{
        top:0px;
        transform: rotateY(360deg);
    }
}
@keyframes tarjeta5{
    0%{
        top:-300px;
        left:-300px;
        transform: rotateY(0deg);
    }
    50%{
        top:300px;
        left: 400px;
        transform: rotateY(90deg);
    }
    100%{
        top:0px;
        transform: rotateY(360deg);
    }
}

/*EVENTOS*/
.tarjeta1:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}
.tarjeta2:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}
.tarjeta3:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}
.tarjeta4:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}
.tarjeta5:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;

}

.tarjeta1, .tarjeta2, .tarjeta3, .tarjeta4, .tarjeta5{
                box-shadow: 0px 0px 20px rgb(42, 252, 241);
            }

.cuadrito{
     box-shadow: 0px 0px 20px rgb(213, 252, 42);
}
</style>
</head>
<body>
    <div class="contenedor">
        <div class="cuadrito">
           Tecnologias de desarrollo Web
        </div>
    <div class="tarjeta1"></div>
    <div class="tarjeta2"></div>
    <div class="tarjeta3"></div>
    <div class="tarjeta4"></div>
    <div class="tarjeta5"></div>
</div>    
</body>

</html>
