<html>
    <head>
        <title>

        </title>
        <style>
            *{
                margin:0px;
                padding:0px;
            }
            .contenedor{
                
                height: 300px;
                width: 800px;
                border: 1px solid black;
                margin: 0 auto;
                position: relative;
                overflow: hidden;
            }
            
            .cuadrito{
                width: 100px;
                height: 100px;
                position: absolute;
                top: 100px;
                left: 0px;
                animation: cuadrito 4s infinite;
            }

            .loro{
                position: absolute;
                width: 100%;
                z-index: 0;
            }

            @keyframes cuadrito{
                0%{
                    top:100px;
                    left: -100px;
                    rotate: 45deg;
                }
                33%{
                    top:0px;
                    left:350px ;
                    rotate: 45deg;
                }
                66%{
                    top:200px;
                    left:350px ;
                    rotate: 0deg;

                }
                100%{
                    top:100px;
                    left:850px ;
                    rotate: 45deg;
                }
            }
            .cuadrito2{
                width: 100px;
                height: 100px;
                position: absolute;
                top: 100px;
                left: 0px;
                animation: cuadrito 4s infinite 2s;
            }

            .loro2{
                position: absolute;
                width: 80%;
                z-index: - 100;
            }

            @keyframes cuadrito2{
                0%{
                    top:100px;
                    left: -100px;
                    rotate: 45deg;
                }
                33%{
                    top:0px;
                    left:350px ;
                    rotate: 45deg;
                }
                66%{
                    top:200px;
                    left:350px ;
                    rotate: 0deg;

                }
                100%{
                    top:100px;
                    left:850px ;
                    rotate: 45deg;
                }
            }
            .pradera{
                position: absolute;
                top: -470;
                left: 0;
                width: 100%;
                z-index: -2;
            }

            .cielo{
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                z-index: -3;
            }

        </style>
    </head>
    <body>
        <div class="contenedor">
            <div class="cuadrito" >
                <img  class="loro" src="img/pajaro1.png" alt="" ;>
            </div>
            <div class="cuadrito2" >
                <img  class="loro2" src="img/pajaro1.png" alt="" ;>
            </div>
            <img  class="cielo" src="img/cielo.png" alt="" ;>
            <img  class="pradera" src="img/pradera.png" alt="" ;>
        </div>
    </body>
    <a href="../index.html">Regresar al inicio</a>
</html>
