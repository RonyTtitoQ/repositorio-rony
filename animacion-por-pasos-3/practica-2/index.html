<html>
<head>
<title>Herramientas de desarrollo Frontend</title>

<style>

*{
    padding:0;
    margin:0;
    box-sizing:border-box;
}

.contenedor{
    width:300px;
    height:500px;
    background-color:rgba(235,183,15,0.966);
    margin:0 auto;
    position:relative;
    overflow:hidden;
}


.palmera{
    width:210px;
    height:200px;

    position:absolute;

    top:-10px;
    right:-10px;

    background-image:url(img/palmera.png);
    background-size:contain;
    background-repeat:no-repeat;
    background-position:right top;

    transform-origin:100% 0%;

    animation:entrar 7s ease-in-out 2s both;
}

@keyframes entrar{

    0%{
        transform:rotate(0deg);
        opacity:1;
    }

    20%{
        transform:rotate(8deg);
    }

    40%{
        transform:rotate(-6deg);
    }

    60%{
        transform:rotate(8deg);
    }

    80%{
        transform:rotate(-6deg);
    }

    100%{
        transform:rotate(-5deg);
    }
}


@keyframes lluvia{

    0%{
        transform:translateY(-500px);
        opacity:0;
    }

    100%{
        transform:translateY(0);
        opacity:1;
    }
}

@keyframes bajar{

    0%{
        transform:translateY(0);
        opacity:1;
    }

    100%{
        transform:translateY(600px);
        opacity:0;
    }
}

@keyframes textoIn{

    to{
        opacity:1;
        transform:translateX(0);
    }
}

@keyframes textoOut{

    to{
        transform:translateX(300px);
        opacity:0;
    }
}

@keyframes fadeIn{

    to{
        opacity:1;
    }
}

@keyframes cocoIn{

    0%{
        transform:scale(0.3);
        opacity:0;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes florIn{

    0%{
        transform:translateY(40px) scale(0.5);
        opacity:0;
    }

    100%{
        transform:translateY(0) scale(1);
        opacity:1;
    }
}

.coco,.coco1,.coco2,.coco3,.cocomita,.trozo,.coco4,.flor{
    position:absolute;

    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;

    opacity:0;
}

.coco,.coco1,.coco2,.coco3,.cocomita,.trozo{
    animation:
    lluvia 2s ease-in forwards,
    bajar 2s ease-in forwards var(--delay);
}

.coco{
    width:200px;
    height:200px;

    top:380px;
    left:130px;

    background-image:url(img/coco.png);
    --delay:3.5s;
}

.coco1{
    width:120px;
    height:120px;

    top:270px;
    left:150px;

    background-image:url(img/coco\ 1.png);
    --delay:3.8s;
}

.coco2{
    width:140px;
    height:140px;

    top:320px;
    left:1px;

    background-image:url(img/coco\ 2.png);
    --delay:4.1s;
}

.coco3{
    width:110px;
    height:110px;

    top:130px;
    left:60px;

    background-image:url(img/coco\ 3.png);
    --delay:4.4s;
}

.cocomita{
    width:130px;
    height:130px;

    top:-2px;
    left:170px;

    background-image:url(img/coco\ mitad.png);
    --delay:4.7s;
}

.trozo{
    width:130px;
    height:130px;

    top:-20px;
    left:-8px;

    background-image:url(img/trozo.png);
    --delay:5s;
}


.texto{
    position:absolute;

    top:210px;
    left:10px;

    color:white;

    font-family:Arial;
    font-size:22px;
    font-weight:bold;

    animation:textoOut 2s ease-in forwards;
    animation-delay:5s;
}

.texto span{
    display:block;

    opacity:0;

    transform:translateX(-80px);

    animation:textoIn 0.8s ease-out forwards;
}

.texto span:nth-child(1){
    animation-delay:3.2s;
}

.texto span:nth-child(2){
    animation-delay:3.6s;
}

.texto span:nth-child(3){
    animation-delay:4s;
}


.centro-texto,.centro-text{
    position:absolute;

    left:50%;
    transform:translateX(-50%);

    width:90%;

    text-align:center;

    color:white;

    font-family:Arial,sans-serif;
    font-weight:900;

    line-height:0.9;
    letter-spacing:3px;

    opacity:0;

    z-index:5;

    animation:fadeIn 1s ease forwards;
    animation-delay:5.8s;
}

.centro-texto{
    top:95px;
    font-size:75px;
}

.centro-text{
    top:290px;
    font-size:50px;
}

.coco4{
    width:230px;
    height:230px;

    top:120px;
    left:35px;

    background-image:url(img/coco\ 4.png);

    z-index:6;

    animation:cocoIn 1s ease forwards;
    animation-delay:8s;
}

.flor{
    width:120px;
    height:120px;

    top:200px;
    left:95px;

    background-image:url(img/flor.png);

    z-index:7;

    animation:florIn 1s ease forwards;
    animation-delay:8.8s;
}

</style>
</head>

<body>
<a href="../index.html">Regresar al inicio</a>
<div class="contenedor">

    <div class="texto">
        <span>YA PROBASTE</span>
        <span>EL NUEVO</span>
        <span>SABOR</span>
    </div>

    <div class="palmera"></div>

    <div class="coco"></div>
    <div class="coco1"></div>
    <div class="coco2"></div>
    <div class="coco3"></div>
    <div class="cocomita"></div>
    <div class="trozo"></div>

    <div class="centro-texto">
        COCO
        <br>
        +
    </div>

    <div class="centro-text">
        VAINILLA
    </div>

    <div class="coco4"></div>
    <div class="flor"></div>

</div>

</body>
</html>
