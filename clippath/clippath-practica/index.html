<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIPPATH SEMANA 6</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            background-color: aqua;
        }

        .marco{
            width: 200px;
            height: 200px;
            background-image: url(img/hidra.jpg);
            background-size:cover ;
            clip-path: polygon(50% 0%, 90% 20%, 100% 60%, 75% 100%, 25% 100%, 0% 60%, 10% 20%);
        }

        .contenedor{
            width: 500px;
            height: 700px;
            border: 1px solid black;
            background-color: white;
            position: relative;
            margin:0 auto;
            overflow: hidden;
        }

        .marco1{
            width: 200px;
            height: 200px;
            background-image: url(img/gorro.jpg);
            background-size:cover ;
            position: absolute;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            
            top: -100px;
            left: 150px;
            z-index: 1;

            animation: marco1 2s forwards;
        }

        @keyframes marco1 {
            0%{
                top:-100px;
                left: 150px;
            }

            50%{
                top:-20px;
                left:60px;
                transform: rotate(180deg);
            }
            100%{
                top: 0px;
                left: 150px;
            }

        }
        
        .marco2{
            width: 200px;
            height: 200px;
            background-image: url(img/cara.jpg);
            background-size:cover ;
            position: absolute;
            clip-path: circle(50% at 50% 50%);
            
            top: 150px;
            left: 155px;
            animation: marco2 2s forwards;
        }
        @keyframes marco2 {
            0%{
                top: 150px;
                left: 300px;
            }

            50%{
                top:-20px;
                left:60px;
                transform: rotate(-360deg);
            }
            100%{
                top: 150px;
                left: 155px;
            }

        }

        .marco3{
            width: 200px;
            height: 200px;
            background-image: url(img/casaca.jpg);
            background-size: cover;
            position: absolute;
            clip-path: polygon(35% 0, 66% 0, 90% 100%, 18% 100%);
            
            top:340px ;
            left:150px ;
            z-index: 1;
        }

        .marco4{
            width: 350px;
            height: 200px;
            background-image: url(img/brazos.jpg);
            background-size:cover ;
            position: absolute;
            clip-path: polygon(10% 39%, 89% 39%, 100% 50%, 88% 58%, 10% 59%, 0 50%);

            top:310px ;
            left:80px ;
        }

        .marco5{
            width: 200px;
            height: 200px;
            background-image: url(img/pies.jpg);
            background-size:cover ;
            position: absolute;
            clip-path: ellipse(34% 16% at 50% 50%);

            top:450px ;
            left:85px ;
            z-index: 1;
            animation: marco5 5s forwards ;
        }
        @keyframes marco5{
            0%{
                top:450px;
                left: 85px;
                transform: rotate(-10deg);

            }
            50%{
                top: 455px;
                left: 90px;
                transform: rotate(0deg);
            }

        }

        .marco6{
            width: 200px;
            height: 200px;
            background-image: url(img/pies.jpg);
            background-size:cover ;
            position: absolute;
            clip-path: ellipse(34% 16% at 50% 50%);

            top:450px ;
            left:225px ;
            z-index: 1;
            animation: marco6 5s forwards;
        }

        @keyframes marco6{
            0%{
                top:450px;
                left: 225px;
                transform: rotate(10deg);

            }
            50%{
                top: 455px;
                left: 230;
                transform: rotate(0deg);
            }

        }
        /* helado */
        .figura1{
            width: 170px;
            height: 180px;
            background-image: url(img/cono.jpg);
            background-size:cover ;
            position: absolute;
            clip-path: polygon(49% 99%, 17% 28%, 78% 27%);

            top:250px ;
            left:350px ;
        }
        .figura2,.figura3,.figura4{
            width: 220px;
            height: 200px;
            background-image: url(img/helado.jpg);
            background-size:cover ;
            position: absolute;
            clip-path: circle(15.7% at 50% 50%);
        }

        .figura2{
            top:200px ;
            left:350px ;
        }

        .figura3{
            top:200px ;
            left:290px ;
        }

        .figura4{
            top:155px ;
            left:320px ;
        }

    </style>
</head>
<body>
    <a href="../../index.html">Regresar al inicio</a>
    
    <div class="marco"></div>

    <div class="contenedor">
        <!-- Muñeco -->
        <div class =marco1></div>
        <div class =marco2></div>
        <div class =marco3></div>
        <div class =marco4></div>
        <div class =marco5></div>
        <div class =marco6></div>

        <!-- Helado -->
        <div class =figura1></div>
        <div class =figura2></div>
        <div class =figura3></div>
        <div class =figura4></div>
    </div>
</body>
</html>
